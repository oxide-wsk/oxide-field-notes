# Oracle Linux 7.9 unattended install for Oxide: cloud-init enabled, DHCP on,
# serial console, plain partitions so cloud-init can grow the root filesystem.
#
# __TARGET_DISK__ is substituted by build-iso.sh. The installer disk is the
# boot disk, so the install target is normally the second NVMe device.

text
poweroff
cdrom
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Root stays locked: access comes from cloud-init (user_data) on first boot.
rootpw --lock

# Without this the installed NIC is ONBOOT=no and the guest never sends a
# DHCP request.
network --bootproto=dhcp --device=link --onboot=yes --activate
firewall --disabled
selinux --enforcing
services --enabled=sshd,chronyd

# Only touch the target disk. Anaconda also refuses to wipe the disk it is
# installing from, but don't rely on that.
ignoredisk --only-use=__TARGET_DISK__
zerombr
clearpart --all --initlabel --drives=__TARGET_DISK__
bootloader --location=mbr --boot-drive=__TARGET_DISK__ --append="console=tty0 console=ttyS0,115200n8"
part /boot/efi --fstype=efi --size=200 --ondisk=__TARGET_DISK__
part /boot --fstype=xfs --size=1024 --ondisk=__TARGET_DISK__
# Plain partition rather than LVM: growpart can extend it when the disk is resized.
part / --fstype=xfs --size=4096 --grow --ondisk=__TARGET_DISK__

%packages
@core
cloud-init
cloud-utils-growpart
chrony
-NetworkManager-wifi
-iwl*-firmware
%end

%post --log=/root/ks-post.log
set -eu

# Oxide delivers keys and user_data through a NoCloud CIDATA volume. Oracle's
# cloud.cfg sets ssh_deletekeys: 0, so without the override every instance made
# from one image would share its SSH host keys.
cat > /etc/cloud/cloud.cfg.d/90-oxide.cfg <<'EOF'
datasource_list: [ NoCloud, None ]
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]
EOF

systemctl enable cloud-init-local cloud-init cloud-config cloud-final

# Serial access for the GRUB menu as well as the kernel.
cat >> /etc/default/grub <<'EOF'
GRUB_TERMINAL="serial console"
GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200"
EOF
grub2-mkconfig --output=/boot/efi/EFI/redhat/grub.cfg

# Strip per-install identity so every instance made from this image is unique.
rm --force /etc/ssh/ssh_host_*
truncate --size=0 /etc/machine-id
sed --in-place --expression '/^HWADDR=/d' --expression '/^UUID=/d' \
  /etc/sysconfig/network-scripts/ifcfg-*
yum clean all
%end
