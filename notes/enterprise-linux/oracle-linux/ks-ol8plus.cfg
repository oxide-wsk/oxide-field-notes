# Oracle Linux 8, 9 and 10 unattended install for Oxide: cloud-init enabled, DHCP on,
# serial console, plain partitions so cloud-init can grow the root filesystem.
# Same shape as ks.cfg (OL7), except the install source, the target disk
# (chosen in %pre, not at build time) and %post.

text
poweroff
# Oxide attaches the ISO as an NVMe disk, not an optical drive, and from OL8
# on, Anaconda does not find packages there with `cdrom`. Name the
# ISO's filesystem by label instead; __ISO_LABEL__ is set by build-iso.sh.
harddrive --partition=LABEL=__ISO_LABEL__ --dir=/
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Root stays locked: access comes from cloud-init (user_data) on first boot.
rootpw --lock

# Without this the installed NIC profile may not autoconnect and the guest
# never sends a DHCP request.
network --bootproto=dhcp --device=link --onboot=yes --activate
firewall --disabled
selinux --enforcing
services --enabled=sshd,chronyd

# Disk layout comes from %pre, which writes it to /tmp/disk.ks.
%include /tmp/disk.ks

# Kernel 6.12 probes NVMe controllers asynchronously, so nvme0n1/nvme1n1 do
# not reliably follow attach order. Pick the one NVMe disk that is not the
# installer (found by its label). Anything other than exactly one candidate
# writes no include, and Anaconda stops instead of guessing.
%pre --erroronfail --log=/tmp/ks-pre.log
set -eu
src="$(blkid --label '__ISO_LABEL__')"
parent="$(lsblk --noheadings --nodeps --output PKNAME "$src")"
srcdisk="/dev/${parent:-$(basename "$src")}"
candidates="$(lsblk --noheadings --nodeps --paths --output NAME,TYPE |
	awk '$2 == "disk" && $1 ~ /nvme/ { print $1 }' | grep --invert-match --line-regexp "$srcdisk" || true)"
echo "ks-pre: installer $srcdisk, target candidates: $candidates" | tee /dev/console
[ "$(echo "$candidates" | grep --count .)" -eq 1 ] || exit 1
d="$(basename "$candidates")"
cat > /tmp/disk.ks <<EOF
# Only touch the target disk.
ignoredisk --only-use=$d
zerombr
clearpart --all --initlabel --drives=$d
bootloader --location=mbr --boot-drive=$d --append="console=tty0 console=ttyS0,115200n8"
part /boot/efi --fstype=efi --size=600 --ondisk=$d
part /boot --fstype=xfs --size=1024 --ondisk=$d
# Plain partition rather than LVM: growpart can extend it when the disk is resized.
part / --fstype=xfs --size=4096 --grow --ondisk=$d
EOF
%end

%packages
@core
cloud-init
cloud-utils-growpart
chrony
-iwl*-firmware
%end

%post --log=/root/ks-post.log
set -eu

# Oxide delivers keys and user_data through a NoCloud CIDATA volume. Oracle's
# cloud.cfg sets ssh_deletekeys: 0, so without the override every instance made
# from one image would share its SSH host keys.
cat > /etc/cloud/cloud.cfg.d/90-oxide.cfg <<'EOF'
datasource_list: [ NoCloud, None ]
ssh_deletekeys: true
ssh_genkeytypes: [rsa, ecdsa, ed25519]
EOF

systemctl enable cloud-init-local cloud-init cloud-config cloud-final

# Serial access for the GRUB menu as well as the kernel. On EL9+ the file on
# the ESP is a stub that loads /boot/grub2/grub.cfg; overwriting the stub is
# what grub2-mkconfig warns against. EL8 boots the ESP file directly.
cat >> /etc/default/grub <<'EOF'
GRUB_TERMINAL="serial console"
GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200"
EOF
grubcfg=/boot/grub2/grub.cfg
if ! grep --quiet configfile /boot/efi/EFI/redhat/grub.cfg; then
	grubcfg=/boot/efi/EFI/redhat/grub.cfg
fi
grub2-mkconfig --output="$grubcfg"

# Anaconda's profile is bound to the NIC's install-time name, which changes
# once the installer disk is detached and the NIC moves to another PCI slot.
# Replace it with one that matches any Ethernet NIC, so DHCP works
# at boot on its own; the low priority lets cloud-init's per-NIC profile win
# when it writes one. EL8's Anaconda writes ifcfg files instead of keyfiles;
# NetworkManager still reads keyfiles there.
rm --force /etc/NetworkManager/system-connections/*.nmconnection
find /etc/sysconfig/network-scripts -name 'ifcfg-*' ! -name ifcfg-lo -delete 2>/dev/null || true
cat > /etc/NetworkManager/system-connections/oxide-dhcp.nmconnection <<'EOF'
[connection]
id=oxide-dhcp
type=ethernet
autoconnect=true
autoconnect-priority=-10

[ipv4]
method=auto

[ipv6]
method=auto
EOF
chmod 600 /etc/NetworkManager/system-connections/oxide-dhcp.nmconnection

# Strip per-install identity so every instance made from this image is unique.
rm --force /etc/ssh/ssh_host_*
truncate --size=0 /etc/machine-id
dnf clean all
%end
